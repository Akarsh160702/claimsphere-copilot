# =============================================================================
# ClaimSphere Copilot — Backend deploy (FastAPI -> Azure Container Apps)
#
# Build strategy: GitHub-runner Docker build + direct ACR push (no ACR Tasks).
# ACR Tasks (remote build) is blocked on hackathon/lab subscriptions. This
# workflow builds on the free GitHub runner and pushes the image to ACR, then
# tells the Container App to use the new image. No local tooling required.
#
# ONE-TIME SETUP (browser only — see DEPLOYMENT.md for complete setup guide):
#   Repo -> Settings -> Secrets and variables -> Actions
#     Secrets:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     Variables: AZURE_RESOURCE_GROUP, ACR_NAME, CONTAINERAPP_NAME
# =============================================================================
name: Deploy backend (Container Apps)

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "data/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Log in to ACR directly (token from az login — no ACR Tasks used)
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      # Build the image on the GitHub runner and push it directly to ACR.
      # This avoids ACR Tasks entirely — works on all subscription types.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/claimsphere-api:${{ github.sha }},${{ vars.ACR_NAME }}.azurecr.io/claimsphere-api:latest
          cache-from: type=registry,ref=${{ vars.ACR_NAME }}.azurecr.io/claimsphere-api:latest
          cache-to: type=inline

      # Update the Container App to use the freshly-built image
      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/claimsphere-api:${{ github.sha }}

      - name: Print deployed URL
        run: |
          URL=$(az containerapp show \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend live at: https://$URL"
